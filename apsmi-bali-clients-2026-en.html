function render(){
 const ids=new Set(DATA.clients.map(c=>c.id));if(ids.size!==DATA.clients.length||DATA.clients.some(c=>!PRIORITIES.includes(c.priority))||PRIORITIES.reduce((n,p)=>n+countFor(p),0)!==DATA.clients.length)throw Error('Category reconciliation failed');$('archiveTitle').textContent=EN?'Complete evidence archive · '+(DATA.records||[]).length+' original records (Chinese)':'完整原文附录 · '+(DATA.records||[]).length+'条记录';$('archiveNote').textContent=EN?'All original comments are retained, including regulatory, academic, agenda and image-only records. Speaker / booth research is not reception or procurement evidence.':'保留全部评论原文，包括监管、学术、议程和仅图片记录；重点参考图见对应企业档案。演讲与展台研究不等于客户接待或采购。';const m=DATA.meta||{};$('title').textContent=m.title||T.title;$('eventName').textContent=m.eventName||'';$('meta').textContent=[m.date,DATA.clients.length+' '+T.total].filter(Boolean).join(' · ');$('coverage').textContent=T.coverage(m);$('scopeOverview').textContent=T.coverage(m);
 $('stats').innerHTML=['all',...PRIORITIES].map(k=>'<div class="stat"><b>'+countFor(k)+'</b><span>'+esc(k==='all'?T.total:k)+'</span></div>').join('');
 const cats=['all',...PRIORITIES];$('filters').innerHTML=cats.map(k=>'<button class="filter '+(current===k?'active':'')+'" data-category="'+k+'"><span>'+esc(k==='all'?T.all:k)+'</span><span>'+countFor(k)+'</span></button>').join('');
 $('filters').querySelectorAll('button').forEach(b=>b.onclick=()=>{current=b.dataset.category;limit=24;render();});
 const planned=DATA.clients.filter(c=>c.visitStatusCode==='planned');const audit=m.visitSummary||m.visitReview?.note||'';$('visitReview').hidden=!audit&&!planned.length;$('visitReview').innerHTML='<h2>'+T.visitReview+'</h2>'+(audit?'<p>'+esc(audit)+'</p>':'')+(planned.length?'<div class="plan-grid">'+planned.map(c=>'<div class="plan-item"><strong>'+esc(c.name)+'</strong>'+esc(txt(c.visitDates))+'<br><span class="plan-note">'+esc(c.visitStatus||T.planned)+'</span></div>').join('')+'</div>':'');
 const visits=DATA.clients.filter(c=>c.priority===PRIORITIES[0]);$('visitList').innerHTML=visits.length?visits.map(c=>'<button data-id="'+c.id+'">'+esc(c.name)+(c.visitStatusCode==='planned'?' · '+(EN?'planned':'已有计划'):'')+'</button>').join(''):'<p class="no-visits">'+T.noPriorityVisits+'</p>';
 $('visitList').querySelectorAll('button').forEach(b=>b.onclick=()=>{current='all';query='';limit=24;$('search').value='';render();document.getElementById('client-'+b.dataset.id)?.scrollIntoView({behavior:'smooth',block:'start'});});
 const shown=DATA.clients.filter(c=>(current==='all'||c.priority===current)&&(!query||searchIndex.get(c.id).includes(query)));
 $('count').textContent=T.count(shown.length,DATA.clients.length);$('cards').innerHTML=shown.length?shown.slice(0,limit).map(card).join(''):'<div class="empty">'+T.none+'</div>';$('more').hidden=shown.length<=limit;
 $('cards').querySelectorAll('.detail-btn').forEach(b=>b.onclick=()=>{const c=DATA.clients.find(c=>c.id===b.dataset.id),d=$('detail-'+c.id);if(d.hidden){d.innerHTML=detail(c);d.hidden=false;loadPhotos(d);}else{d.hidden=true;d.replaceChildren();}b.setAttribute('aria-expanded',String(!d.hidden));b.textContent=d.hidden?T.expand:T.collapse;});
}
function card(c){return '<article class="card" id="client-'+c.id+'"><div class="card-head"><span class="number">'+c.id+'</span><span class="tag '+(c.priority===PRIORITIES[0]?'visit-tag':c.priority===PRIORITIES[3]?'no':'')+'">'+esc(c.priority)+'</span></div><h2>'+esc(c.name)+'</h2><div class="sub">'+esc([c.country,c.city,c.role].filter(Boolean).join(' · '))+'</div>'+(c.visitStatusCode==='planned'?'<div class="visit-state">'+T.plannedStatus+'<br>'+esc(c.visitDates)+'</div>':'')+'<p class="reason">'+esc(c.reason)+'</p>'+field(T.need,c.demand)+field(T.attendance,c.attendance)+field(T.direction,c.direction)+'<div class="next"><strong>'+T.next+'</strong>'+esc(c.next)+(c.owner?'<br><span class="evidence">'+T.owner+': '+esc(c.owner)+'</span>':'')+'</div><button class="detail-btn" data-id="'+c.id+'" aria-expanded="false" aria-controls="detail-'+c.id+'">'+T.expand+'</button><div class="detail" id="detail-'+c.id+'" hidden></div></article>';}
function detail(c){
 const contacts=(c.contacts||[]).map(p=>'<div class="contact"><strong>'+esc(p.name||T.contacts)+'</strong> '+esc(p.title||'')+(p.phone?'<br>'+T.phone+': '+esc(p.phone):'')+(p.email?'<br>'+T.email+': '+esc(p.email):'')+(p.wechat?'<br>WeChat: '+esc(p.wechat):'')+(p.whatsapp?'<br>WhatsApp: '+esc(p.whatsapp):'')+(p.note?'<br>'+esc(p.note):'')+(p.source?'<br><span class="evidence">'+esc(p.source)+'</span>':'')+'</div>').join('');
 const sources=(c.sources||[]).map(s=>{const url=safeUrl(s.url);return (url?'<a class="source" target="_blank" rel="noopener noreferrer" href="'+esc(url)+'">'+esc(s.title||url)+'</a>':'<span class="source">'+esc(s.title||T.sourceLocal)+'</span>')+(s.evidence?'<div class="evidence">'+esc(s.evidence)+'</div>':'');}).join('');
 return field(T.legal,c.legalName)+field(T.company,c.company)+field(T.products,c.products)+field(T.value,c.value)+field(T.target,c.target)+(contacts?'<div class="field"><strong>'+T.contacts+'</strong><div class="contacts">'+contacts+'</div></div>':'')+field(T.visitLabel,c.visitStatus)+field(T.plannedDates,c.visitDates)+field(T.arrangements,c.existingPlan)+field(T.history,c.visitHistory)+field(T.uncertainties,c.uncertainties)+(c.sourceNotes?'<details class="field"><summary>'+T.original+'</summary><p class="evidence">'+T.originalNote+'</p><div style="white-space:pre-wrap;overflow-wrap:anywhere">'+esc(c.sourceNotes)+'</div></details>':'')+(c.images?.length?'<div class="field"><strong>'+T.photos+'</strong><div class="gallery">'+c.images.map(im=>'<button class="photo" data-asset="'+im.asset+'"><span class="loading-photo">'+T.photoLoading+'</span><img hidden alt="'+esc(im.caption)+'"><span>'+esc(im.caption)+'</span></button>').join('')+'</div></div>':'')+(sources?'<div class="field"><strong>'+T.sources+'</strong>'+sources+'</div>':'')+field(T.records,c.sourceRecords?.map(n=>'R'+String(n).padStart(3,'0')).join(', '));
}
function loadPhotos(container){const g=generation;container.querySelectorAll('.photo').forEach(button=>{const img=button.querySelector('img'),status=button.querySelector('.loading-photo');async function load(){const asset=await getAsset(button.dataset.asset);if(g!==generation||!button.isConnected)return;img.src=asset.url;img.hidden=false;status.hidden=true;return asset;}load().catch(()=>{if(button.isConnected)status.textContent=T.photoError;});button.onclick=async()=>{try{const asset=await load();if(!asset||g!==generation)return;$('fullPhoto').src=asset.url;$('fullPhoto').alt=img.alt;$('caption').textContent=img.alt;$('lightbox').showModal();}catch{status.textContent=T.photoError;}};});}
$('download').onclick=async()=>{if(!DATA)return;const g=generation,workbook=DATA.workbook;$('download').disabled=true;$('downloadStatus').textContent=T.preparing;try{const a=await getAsset(workbook.asset);if(g!==generation||!DATA)return;$('saveWorkbook').href=a.url;$('saveWorkbook').download=workbook.name;$('saveWorkbook').hidden=false;$('download').hidden=true;$('downloadStatus').textContent=T.ready;}catch{if(g===generation)$('downloadStatus').textContent=T.downloadError;}finally{if(g===generation)$('download').disabled=false;}};
$('search').oninput=e=>{query=e.target.value.trim().toLowerCase();limit=24;render();};$('more').onclick=()=>{limit+=24;render();};$('closePhoto').onclick=()=>$('lightbox').close();$('lightbox').addEventListener('click',e=>{if(e.target===$('lightbox'))$('lightbox').close();});

$('archive').ontoggle=()=>{if(!$('archive').open){$('archiveBody').replaceChildren();return;}if(!DATA)return;$('archiveBody').innerHTML=(DATA.records||[]).map(r=>'<details class=\"field\"><summary>'+esc(r.id)+' · '+esc(r.text.replace(/\n/g,' ').slice(0,90))+'</summary><div style=\"white-space:pre-wrap;overflow-wrap:anywhere\">'+esc(r.text)+'</div>'+field(EN?'Original image filenames':'原图文件名',r.images?.join(', '))+'</details>').join('');};
</script></body></html>
