}

function panelContent(c){if(panelSection==='visitPhotos')return renderVisitPhotos(c);if(panelSection==='overview')return '<div class="profile-columns">'+block(EN?'Company & assessment':'企业与判断',field(T.target,c.target)+field(T.value,c.value)+field(T.legal,c.legalName)+field(T.company,c.company))+block(EN?'Products & field record':'产品与现场信息',field(EN?'Classification reason':'分类理由',c.reason)+field(T.localProducts,c.localProducts||c.products)+field(T.direction,c.direction)+field(T.need,c.demand)+field(T.attendance,c.attendance))+'</div>';
 if(panelSection==='production')return '<div class="profile-columns">'+block(EN?'Production source':'生产来源',field(T.production,c.production)+field(T.productionEntity,c.productionEntity)+field(T.visitLabel,c.visitStatus)+field(T.plannedDates,c.visitDates)+field(T.arrangements,c.existingPlan)+field(T.history,c.visitHistory))+block(EN?'Follow-up route':'跟进路径',field(T.decisionPath,c.decisionPath)+field(T.contactLink,c.contactLink)+'<div class="next"><strong>'+T.next+'</strong>'+esc(c.next)+'</div>'+field(T.uncertainties,c.uncertainties))+'</div>';
 if(panelSection==='contacts'){const contacts=c.contacts.map(p=>'<article class="contact"><h3>'+esc(p.name||T.contacts)+'</h3><p>'+esc(p.title||'')+'</p>'+field(T.phone,p.phone)+field(T.email,p.email)+field('WeChat',p.wechat)+field('WhatsApp',p.whatsapp)+field(EN?'Record / note':'记录／备注',[p.note,p.source].filter(Boolean).join(' · '))+'</article>').join('');return block(T.contactLink,field(T.contactLink,c.contactLink)+field(T.owner,c.owner))+'<div class="contact-grid">'+(contacts||'<p class="empty-section">'+(EN?'No contact details in the field record.':'现场记录中暂无联系方式。')+'</p>')+'</div>';}
 if(panelSection==='evidence'){const photos=c.images.map(im=>'<button class="photo" data-asset="'+im.asset+'"><span class="loading-photo">'+T.photoLoading+'</span><img hidden alt="'+esc(im.caption)+'"><span>'+esc(im.caption)+'</span></button>').join('');const sources=c.sources.map(s=>{const u=safeUrl(s.url);return '<article class="source-item">'+(u?'<a class="source" target="_blank" rel="noopener noreferrer" href="'+esc(u)+'">'+esc(s.title||u)+'</a>':'<strong>'+esc(s.title||T.sourceLocal)+'</strong>')+'<p>'+esc(s.evidence||'')+'</p></article>';}).join('');const lu=safeUrl(c.logo?.source);return '<div class="profile-columns evidence-columns">'+block(T.photos,photos?'<div class="gallery">'+photos+'</div>':'<p class="empty-section">'+(EN?'No reference image for this profile.':'本档案暂无参考图片。')+'</p>')+block(T.sources,sources+(lu?'<a class="logo-credit" href="'+esc(lu)+'" target="_blank" rel="noopener noreferrer">'+(EN?'Logo source':'Logo来源')+'</a>':''))+'</div>';}
 return block(T.original,field(T.records,c.sourceRecords.map(n=>'R'+String(n).padStart(3,'0')).join(' · '))+'<div class="original-text">'+esc(c.sourceNotes||'')+'</div>');}
$('closeClient').textContent=EN?'Close ×':'关闭 ×';$('previousClient').textContent=EN?'← Previous':'← 上一家';$('nextClient').textContent=EN?'Next →':'下一家 →';
$('closeClient').onclick=()=>$('clientPanel').close();$('clientPanel').addEventListener('close',()=>{document.body.classList.remove('panel-open');$('panelBody').replaceChildren();$('panelIdentity').replaceChildren();$('panelTabs').replaceChildren();panelId=null;if(panelOpener?.isConnected)panelOpener.focus();panelOpener=null;});
$('clientPanel').addEventListener('click',e=>{if(e.target===$('clientPanel')){const r=$('clientPanel').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)$('clientPanel').close();}});
for(const [id,step]of [['previousClient',-1],['nextClient',1]])$(id).onclick=()=>{const pool=visibleClients(),i=pool.findIndex(c=>c.id===panelId),next=pool[i+step];if(next)openPanel(next.id,null,true);};
</script></body></html>
