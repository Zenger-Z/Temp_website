<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer"><title>ALLPack 2026 · 客户跟进报告</title>
<style>
:root{--navy:#152f65;--ink:#172844;--muted:#697588;--paper:#f6f5f1;--line:#e1e5ec;--orange:#e87530;--white:#fff}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,"Microsoft YaHei","PingFang SC",sans-serif;line-height:1.7}button,input,select{font:inherit}button,a,input,select{touch-action:manipulation}button{cursor:pointer}a{color:var(--navy);text-underline-offset:3px}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #eea06b;outline-offset:3px}[hidden]{display:none!important}.gate{min-height:100svh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 15% 20%,#244579,transparent 70%),#0d2048}.gate-card{width:min(440px,100%);background:#fff;border-radius:24px;padding:40px;box-shadow:0 24px 80px #0003}.eyebrow{color:var(--orange);font-size:12px;font-weight:800;letter-spacing:2px}.gate h1{font-size:30px;line-height:1.3;margin:18px 0}.gate p{font-size:14px;color:var(--muted)}label{display:block;font-size:13px;font-weight:700}input[type=password]{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px;margin:8px 0 16px}.primary{background:var(--navy);color:#fff;border:0;border-radius:10px;padding:12px 18px;font-weight:700}.gate .primary{width:100%}#error{color:#a33425;min-height:24px;font-size:13px}.shell{max-width:1530px;margin:auto;padding:0 36px 60px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:22px 0;border-bottom:1px solid var(--line);font-size:13px}.brand{font-weight:800;letter-spacing:2px;color:var(--navy)}.top-actions{display:flex;gap:16px;align-items:center}.quiet{border:1px solid var(--line);background:white;border-radius:8px;padding:6px 12px;color:var(--ink)}.hero{padding:48px 0 34px;display:flex;gap:30px;align-items:flex-end;justify-content:space-between}.hero h1{font-size:clamp(28px,3.3vw,48px);line-height:1.25;margin:12px 0}.hero p{margin:8px 0;color:var(--muted);font-size:14px}.hero .primary{white-space:nowrap}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin:0 0 30px}.stat{padding:20px;background:#fff;border:1px solid var(--line);border-radius:14px}.stat b{font-size:32px;line-height:1.2;display:block;font-weight:750;color:var(--navy)}.stat span{font-size:12px;color:var(--muted)}.layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:30px}.sidebar{align-self:start;position:sticky;top:20px}.sidebar h2{font-size:12px;color:var(--muted);letter-spacing:1px;margin:0 0 12px}.filters{display:grid;gap:6px}.filter{display:flex;justify-content:space-between;text-align:left;padding:11px 13px;border:0;border-radius:9px;background:transparent;color:var(--ink);font-size:14px}.filter.active{background:var(--navy);color:white}.filter:not(.active):hover{background:#e8ebef}.method{border-top:1px solid var(--line);padding-top:20px;margin-top:24px;font-size:12px;color:var(--muted)}.method strong{color:var(--ink)}.toolbar{display:flex;gap:12px;justify-content:space-between;margin-bottom:18px;align-items:center}.search{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:11px 14px;background:#fff}.count{font-size:12px;color:var(--muted);white-space:nowrap}.section-title{font-size:20px;margin:0 0 15px}.visit{background:var(--navy);color:white;border-radius:16px;padding:24px;margin-bottom:24px}.visit h2{font-size:18px;margin:0 0 12px}.visit-list{display:flex;gap:8px;flex-wrap:wrap}.visit button{border:1px solid #ffffff40;background:#ffffff12;color:#fff;padding:7px 12px;border-radius:7px;font-size:12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px;min-width:0;scroll-margin-top:20px}.card-head{display:flex;gap:12px;justify-content:space-between;align-items:flex-start}.card h2{font-size:20px;line-height:1.45;margin:8px 0;overflow-wrap:anywhere}.number{font-size:11px;color:var(--muted);letter-spacing:1px}.sub{font-size:12px;color:var(--muted);overflow-wrap:anywhere}.tag{display:inline-block;padding:3px 9px;font-size:11px;border-radius:5px;background:#edf1f7;color:var(--navy);white-space:nowrap}.tag.visit-tag{background:#fff0e5;color:#a94f16}.tag.no{background:#f0f0f0;color:#666}.reason{font-size:13px;padding:12px 0;margin:12px 0 0;border-top:1px solid var(--line)}.field{font-size:13px;margin-top:12px;overflow-wrap:anywhere}.field>strong{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}.next{margin-top:16px;padding:12px;background:#f5f7fa;border-radius:8px;font-size:13px}.next strong{font-size:11px;color:var(--navy);display:block}.detail-btn{width:100%;margin-top:18px;text-align:left;padding:10px 0 0;background:none;border:0;border-top:1px solid var(--line);color:var(--navy);font-size:12px;font-weight:700}.detail{border-top:1px solid var(--line);padding-top:8px;margin-top:12px}.contacts{display:grid;gap:8px}.contact{background:#f6f7f9;padding:12px;border-radius:8px;font-size:12px;overflow-wrap:anywhere}.gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:16px}.photo{padding:0;border:1px solid var(--line);background:#fafafa;border-radius:8px;overflow:hidden;color:var(--muted);text-align:left;font-size:11px}.photo img{width:100%;height:130px;object-fit:contain;display:block;background:#eceeef}.photo span{display:block;padding:7px}.source{display:block;padding:8px 0;border-bottom:1px solid #eee;font-size:12px;overflow-wrap:anywhere}.evidence{color:var(--muted);font-size:11px}.empty{padding:60px 20px;text-align:center;color:var(--muted);grid-column:1/-1}.footer{border-top:1px solid var(--line);margin-top:35px;padding-top:20px;color:var(--muted);font-size:11px}dialog{border:0;border-radius:14px;padding:16px;width:min(1000px,94vw);max-height:94svh;background:#fff}dialog::backdrop{background:#07162cdb}dialog img{display:block;max-width:100%;max-height:75svh;margin:auto;object-fit:contain}dialog .dialog-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;font-size:12px}dialog p{margin:0;overflow-wrap:anywhere}body.locked .shell{display:none}@media(min-width:1350px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:950px){.layout{grid-template-columns:170px minmax(0,1fr);gap:20px}.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(6,1fr)}.stat{padding:14px}.stat b{font-size:26px}}@media(max-width:650px){.shell{padding:0 18px 40px}.topbar{padding:16px 0}.top-actions{gap:8px;font-size:11px;white-space:nowrap;flex-shrink:0}.brand{font-size:12px;letter-spacing:1px}.hero{display:block;padding:30px 0 24px}.hero .primary{margin-top:16px}.stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.stat:first-child{grid-column:auto}.stat b{font-size:28px}.layout{display:block}.sidebar{position:static}.sidebar h2,.method{display:none}.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px}.filter{gap:8px;padding:7px 10px;border:1px solid var(--line);font-size:12px;background:#fff}.grid{grid-template-columns:1fr}.card{padding:20px}.toolbar{gap:8px}.count{font-size:11px}.visit{padding:18px}.gate-card{padding:28px} .gallery{grid-template-columns:1fr 1fr}}@media print{.gate,.sidebar,.toolbar,.top-actions,.hero button,.visit,.detail-btn{display:none!important}.shell{padding:0}.layout{display:block}.grid{display:block}.card{break-inside:avoid;margin-bottom:14px}.detail{display:block!important}}
</style></head><body class="locked"><section class="gate" id="gate"><form class="gate-card" id="login"><div class="eyebrow">JOYEA · ALLPACK 2026</div><h1>客户资料<br>与跟进优先级</h1><p>本报告包含完整客户信息。请输入访问密码。</p><label for="password">访问密码</label><input id="password" type="password" autocomplete="off" required><button class="primary" id="unlock" type="submit">解锁报告</button><div id="error" role="status" aria-live="polite"></div><a href="https://zenger-z.github.io/Temp_website/">返回 Temp Pages</a></form></section>
<main class="shell" id="app" hidden><header class="topbar"><span class="brand">JOYEA / MARKET INTELLIGENCE</span><div class="top-actions"><a href="https://zenger-z.github.io/Temp_website/">Temp Pages</a><button class="quiet" id="lock">锁定</button></div></header><section class="hero"><div><div class="eyebrow">ALLPACK INDONESIA 2026</div><h1>来访客户与跟进优先级</h1><p id="meta"></p></div><button class="primary" id="download">下载完整 Excel ↓</button></section><section class="stats" id="stats" aria-label="客户分类统计"></section><div class="layout"><aside class="sidebar"><h2>跟进优先级</h2><nav class="filters" id="filters" aria-label="客户分类"></nav><div class="method"><strong>判断口径</strong><p>企业价值与本次项目机会分别判断。分类理由、来源依据和待核实信息随客户档案保留。</p><strong>资料范围</strong><p id="coverage"></p></div></aside><section><div class="visit" id="visit"><h2>优先安排拜访</h2><div class="visit-list" id="visitList"></div></div><div class="toolbar"><input id="search" class="search" type="search" placeholder="搜索公司、联系人、产品或需求" aria-label="搜索客户"><span class="count" id="count"></span></div><div class="grid" id="cards"></div></section></div><footer class="footer">JOYEA · ALLPack 2026 客户整理报告。资料来源及待确认事项见各客户档案。</footer></main><dialog id="lightbox"><div class="dialog-head"><p id="caption"></p><button class="quiet" id="closePhoto">关闭 ×</button></div><img id="fullPhoto" alt="参考图片"></dialog>
<script>
'use strict';let DATA=null,current='全部',query='';const $=s=>document.getElementById(s);const cats=['全部','重点拜访','重点跟进','一般跟进','待核实','非目标客户','合作资源'];const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const txt=v=>Array.isArray(v)?v.join('；'):String(v??'');const countFor=k=>DATA.clients.filter(c=>k==='全部'||c.priority===k||(k==='合作资源'&&/合作|代理|供应商|同行/.test(c.role||''))).length;const bytes=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));const safeUrl=s=>{try{const u=new URL(s);return ['https:','http:'].includes(u.protocol)?u.href:'#';}catch{return '#';}};
$('login').addEventListener('submit',async e=>{e.preventDefault();$('error').textContent='正在解锁…';$('unlock').disabled=true;let pw=$('password').value;try{const response=await fetch('./allpack-clients-2026.enc.json',{cache:'no-store'});if(!response.ok)throw new Error('load');const p=await response.json();const m=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);pw='';const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:bytes(p.salt),iterations:p.iterations,hash:'SHA-256'},m,{name:'AES-GCM',length:256},false,['decrypt']);const raw=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(p.iv)},k,bytes(p.ciphertext));DATA=JSON.parse(new TextDecoder().decode(raw));$('password').value='';$('error').textContent='';$('gate').hidden=true;$('app').hidden=false;document.body.classList.remove('locked');render();}catch(err){$('error').textContent=err.message==='load'?'报告文件暂时无法加载，请稍后重试。':'密码不正确，或报告文件未能完整加载。';}finally{$('unlock').disabled=false;}});
$('lock').onclick=()=>{DATA=null;current='全部';query='';$('cards').replaceChildren();$('stats').replaceChildren();$('filters').replaceChildren();$('visitList').replaceChildren();$('search').value='';for(const id of ['meta','coverage','count','caption'])$(id).textContent='';$('fullPhoto').removeAttribute('src');$('lightbox').close();$('app').hidden=true;$('gate').hidden=false;document.body.classList.add('locked');$('password').focus();};
function field(label,value){return value?'<div class="field"><strong>'+esc(label)+'</strong>'+esc(txt(value))+'</div>':'';}
function render(){const m=DATA.meta||{};$('meta').textContent=(m.date||'')+' 更新 · '+DATA.clients.length+' 条主体/线索档案';$('coverage').textContent=(m.sourceComments||319)+' 条评论及回复，'+(m.sourceThreads||74)+' 组主评论，并结合名片与企业公开资料。'+txt(m.notes)+(m.plannedOnly?.length?' 仅邀请未证实到场：'+m.plannedOnly.map(x=>x.name+'（'+x.note+'）').join('；'):'');$('stats').innerHTML=['全部','重点拜访','重点跟进','一般跟进','非目标客户','待核实'].map(k=>'<div class="stat"><b>'+countFor(k)+'</b><span>'+(k==='全部'?'主体/线索档案':k)+'</span></div>').join('');$('filters').innerHTML=cats.map(k=>'<button class="filter '+(current===k?'active':'')+'" data-category="'+k+'"><span>'+k+'</span><span>'+countFor(k)+'</span></button>').join('');$('filters').querySelectorAll('button').forEach(b=>b.onclick=()=>{current=b.dataset.category;render();});const visits=DATA.clients.filter(c=>c.priority==='重点拜访');$('visit').hidden=!visits.length;$('visitList').innerHTML=visits.map(c=>'<button data-id="'+esc(c.id)+'">'+esc(c.name)+'</button>').join('');$('visitList').querySelectorAll('button').forEach(b=>b.onclick=()=>{current='全部';query='';$('search').value='';render();document.getElementById('client-'+b.dataset.id)?.scrollIntoView({behavior:'smooth',block:'start'});});const shown=DATA.clients.filter(c=>(current==='全部'||c.priority===current||(current==='合作资源'&&/合作|代理|供应商|同行/.test(c.role||'')))&&(!query||JSON.stringify(c, (k,v)=>['images','base64','dataUrl'].includes(k)?undefined:v).toLowerCase().includes(query)));$('count').textContent='显示 '+shown.length+' / '+DATA.clients.length;$('cards').innerHTML=shown.length?shown.map(card).join(''):'<div class="empty">没有匹配的客户，请调整搜索或分类。</div>'; $('cards').querySelectorAll('.detail-btn').forEach(b=>b.onclick=()=>{const d=document.getElementById(b.getAttribute('aria-controls'));d.hidden=!d.hidden;b.setAttribute('aria-expanded',String(!d.hidden));b.textContent=d.hidden?'查看完整档案与参考资料 ＋':'收起完整档案 −';});$('cards').querySelectorAll('.photo').forEach(b=>b.onclick=()=>{const c=DATA.clients.find(x=>x.id===b.dataset.client),im=c.images[Number(b.dataset.index)];$('fullPhoto').src=im.dataUrl;$('caption').textContent=im.caption||c.name;$('fullPhoto').alt=im.caption||c.name;$('lightbox').showModal();});}
function card(c){const contacts=(c.contacts||[]).map(p=>'<div class="contact"><strong>'+esc(p.name||'姓名待核实')+'</strong> '+esc(p.title||'')+(p.phone?'<br>电话：'+esc(p.phone):'')+(p.email?'<br>邮箱：'+esc(p.email):'')+'</div>').join('');const sources=(c.sources||[]).map(s=>(safeUrl(s.url)==='#'?'<span class="source">'+esc(s.title||'本地参考资料')+'</span>':'<a class="source" href="'+esc(safeUrl(s.url))+'" target="_blank" rel="noopener noreferrer">'+esc(s.title||s.url)+'</a>')+(s.evidence?'<div class="evidence">'+esc(s.evidence)+'</div>':'')).join('');return '<article class="card" id="client-'+esc(c.id)+'"><div class="card-head"><span class="number">'+esc(c.id)+'</span><span class="tag '+(c.priority==='重点拜访'?'visit-tag':c.priority==='非目标客户'?'no':'')+'">'+esc(c.priority||'待核实')+'</span></div><h2>'+esc(c.name)+'</h2><div class="sub">'+esc([c.country,c.city,c.role].filter(Boolean).join(' · '))+'</div><p class="reason">'+esc(c.reason||'')+'</p>'+field('本次需求',c.demand)+field('来访记录',c.attendance)+field('仅一对应方向',c.direction)+'<div class="next"><strong>下一步</strong>'+esc(c.next||'待明确')+(c.owner?'<br><span class="evidence">现有对接：'+esc(c.owner)+'</span>':'')+'</div><button class="detail-btn" aria-expanded="false" aria-controls="detail-'+esc(c.id)+'">查看完整档案与参考资料 ＋</button><div class="detail" id="detail-'+esc(c.id)+'" hidden>'+field('准确主体',c.legalName)+field('企业介绍',c.company)+field('具体产品',c.products)+field('企业价值',c.value)+field('目标客户判断',c.target)+(contacts?'<div class="field"><strong>联系人</strong><div class="contacts">'+contacts+'</div></div>':'')+field('已有安排',c.existingPlan)+field('待核实信息',c.uncertainties)+(c.sourceNotes?'<details class="field"><summary>完整现场记录</summary><div style="white-space:pre-wrap;overflow-wrap:anywhere;margin-top:10px">'+esc(txt(c.sourceNotes))+'</div></details>':'')+(c.images?.length?'<div class="field"><strong>有价值的参考图片 · 点击放大</strong><div class="gallery">'+c.images.map((im,i)=>'<button class="photo" data-client="'+esc(c.id)+'" data-index="'+i+'"><img loading="lazy" src="'+esc(im.dataUrl)+'" alt="'+esc(im.caption||c.name)+'"><span>'+esc(im.caption||'参考图片')+'</span></button>').join('')+'</div></div>':'')+(sources?'<div class="field"><strong>核验来源</strong>'+sources+'</div>':'')+field('小白板来源记录编号',c.sourceRecords?.join('、'))+'</div></article>';}
$('search').oninput=e=>{query=e.target.value.trim().toLowerCase();render();};$('download').onclick=()=>{if(!DATA?.workbook)return;const blob=new Blob([bytes(DATA.workbook.base64)],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=DATA.workbook.name;a.click();setTimeout(()=>URL.revokeObjectURL(u),2000);};$('closePhoto').onclick=()=>$('lightbox').close();$('lightbox').addEventListener('click',e=>{if(e.target===$('lightbox'))$('lightbox').close();});
</script></body></html>
